spring.application.name=reviewlens-api

spring.datasource.url=jdbc:postgresql://localhost:5432/reviewlens_delivery
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.5-flash
gemini.api.timeout-segundos=60
